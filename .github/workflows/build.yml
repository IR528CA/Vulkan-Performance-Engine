name: Build VPE Native & Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2.0
      with:
        version: 1.3.290.0
        cache: true

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build C++ Native DLL (fsr3_engine.dll)
      run: |
        msbuild fsr3_engine/fsr3_engine.vcxproj /p:Configuration=Release /p:Platform=x64 /p:AdditionalIncludeDirectories="$env:JAVA_HOME\include;$env:JAVA_HOME\include\win32;$env:VULKAN_SDK\Include" /p:AdditionalLibraryDirectories="$env:VULKAN_SDK\Lib"
        Copy-Item -Path "fsr3_engine/x64/Release/fsr3_engine.dll" -Destination "src/main/resources/natives/fsr3_engine.dll" -Force

    - name: Build Fabric Mod JAR
      run: |
        ./gradlew.bat build --no-daemon

    - name: Upload Built Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VulkanPerformanceEngine-Mod
        path: build/libs/*.jar
